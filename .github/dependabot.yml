# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "daily"
    # Stated rather than left to the default of 5, which the npm queue has hit
    # before: at the cap Dependabot opens nothing new until a PR is cleared.
    open-pull-requests-limit: 5

  # Keeps the `uses:` tags in .github/workflows current. Without this, pinned
  # actions silently fall behind and the runner warns about their declared
  # Node runtime (node20 actions forced onto node24).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
